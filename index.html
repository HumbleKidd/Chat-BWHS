<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat BWHS Films</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Outfit:wght@450;650;750&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root { --ink:#1c1430; --muted:#6d6284; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font-family: Outfit, system-ui, sans-serif;
    background: radial-gradient(800px 400px at 0 0, #ffe1c4, transparent 50%), linear-gradient(180deg, #fffaf4, #f4f7ff);
    min-height: 100dvh;
  }
  .app { height: 100dvh; display: grid; grid-template-columns: 260px 1fr; gap: 12px; padding: 12px; }
  .panel { background: #fff; border-radius: 22px; box-shadow: 0 18px 50px rgba(92,48,140,.12); min-height: 0; }
  .side { padding: 16px; }
  h1 { font-family: Fraunces, serif; margin: 0; font-size: 26px; }
  .pill { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; background: #fff4e8; color: #b35a12; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 750; }
  .pill.on { background: #edfff1; color: #137a32; }
  .room { width: 100%; text-align: left; border: 0; background: #fff7f2; border-radius: 12px; padding: 10px; margin-top: 8px; font-weight: 750; }
  .room.active { background: #efe7ff; }
  .stage { display: flex; flex-direction: column; }
  .top { padding: 14px 16px; border-bottom: 1px solid #f0e4dc; }
  .feed { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { background: #fff7f2; border-radius: 16px; padding: 10px 12px; max-width: 78%; }
  .msg.mine { align-self: flex-end; background: #efe7ff; }
  .who { font-weight: 750; font-size: 13px; }
  .bubble { font-size: 16px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .draft { margin: 10px 16px 0; background: #fff; border: 2px dashed #ffb089; border-radius: 14px; padding: 10px 12px; min-height: 44px; font-size: 18px; font-weight: 750; color: #1c1430; }
  .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px; }
  #box {
    width: 100%; border: 2px solid #ff7a59; border-radius: 16px; padding: 14px 16px;
    font: 750 18px Outfit, system-ui, sans-serif; color: #1c1430; background: #fff;
    caret-color: #ff7a59; -webkit-text-fill-color: #1c1430;
  }
  #box::placeholder { color: #b08978; -webkit-text-fill-color: #b08978; font-weight: 500; }
  button.send { border: 0; border-radius: 16px; padding: 0 18px; background: #ff7a59; color: white; font-weight: 750; }
  .note { color: var(--muted); font-size: 13px; padding: 0 16px 10px; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; height: auto; } .feed { min-height: 50dvh; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel side">
    <h1>BWHS Films</h1>
    <div id="conn" class="pill">Connecting…</div>
    <button class="room active" data-room="general"># general</button>
    <button class="room" data-room="introductions"># introductions</button>
    <button class="room" data-room="announcements"># announcements</button>
  </aside>
  <main class="panel stage">
    <div class="top"><strong id="roomTitle"># general</strong></div>
    <div class="feed" id="feed"></div>
    <div class="draft" id="draft">Your letters show here as you type.</div>
    <form class="composer" id="composer">
      <input id="box" type="text" placeholder="Type here. You should see the letters in this box and in the bar above." maxlength="800" autocomplete="off" />
      <button class="send" type="submit">Send</button>
    </form>
    <div class="note" id="note">Sent messages stay on this screen even if the database rejects them.</div>
  </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const CFG = {
  apiKey: "AIzaSyBrOc4fG4Xo4HIMkVHW9ptcfkr1POZI9VA",
  authDomain: "chat-bwhs-films.firebaseapp.com",
  databaseURL: "https://chat-bwhs-films-default-rtdb.firebaseio.com",
  projectId: "chat-bwhs-films"
};
const feed = document.getElementById("feed");
const box = document.getElementById("box");
const draft = document.getElementById("draft");
const note = document.getElementById("note");
const conn = document.getElementById("conn");
const local = JSON.parse(localStorage.getItem("bwhs-me") || "null") || {
  name: "Guest" + Math.floor(Math.random() * 90 + 10),
  color: "#7c5cff"
};
localStorage.setItem("bwhs-me", JSON.stringify(local));
let room = "general";
let db = null;
let live = false;
let seen = new Set();

function add(msg, mine) {
  if (msg.id && seen.has(msg.id)) return;
  if (msg.id) seen.add(msg.id);
  const el = document.createElement("article");
  el.className = "msg" + (mine ? " mine" : "");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = msg.name || "Guest";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = msg.text || "";
  el.append(who, bubble);
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
}
function setConn(on, text) {
  conn.classList.toggle("on", on);
  conn.textContent = text;
}
box.addEventListener("input", () => {
  draft.textContent = box.value ? box.value : "Your letters show here as you type.";
});
document.getElementById("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = box.value.trim();
  if (!text) return;
  const msg = { name: local.name, text, ts: Date.now() };
  add(msg, true);
  box.value = "";
  draft.textContent = "Sent: " + text;
  if (!live) {
    note.textContent = "Showing on this screen only. Firebase is not connected yet.";
    return;
  }
  try {
    await db.ref("rooms/" + room + "/messages").push({ ...msg, color: local.color });
    note.textContent = "Sent to the room.";
  } catch (err) {
    note.textContent = "On screen, but Firebase blocked it. Publish the database rules, then send again.";
  }
});
document.querySelectorAll("[data-room]").forEach(btn => btn.onclick = () => {
  room = btn.dataset.room;
  document.getElementById("roomTitle").textContent = "# " + room;
  document.querySelectorAll(".room").forEach(b => b.classList.toggle("active", b === btn));
  feed.innerHTML = "";
  seen = new Set();
  listen();
});
function listen() {
  if (!live) return;
  db.ref("rooms/" + room + "/messages").limitToLast(50).on("child_added", snap => {
    const v = snap.val() || {};
    add({ id: snap.key, ...v }, false);
  });
}
async function boot() {
  try {
    firebase.initializeApp(CFG);
    db = firebase.database();
    await firebase.auth().signInAnonymously();
    live = true;
    setConn(true, "Live · Firebase");
    listen();
  } catch (err) {
    setConn(false, "Local only");
    note.textContent = err.message || "Could not sign in. Turn on Anonymous auth.";
  }
}
boot();
</script>
</body>
</html>
